schema_version: analysisfact-rules.v1

# P3 TensorFlow/CosmoFlow candidate.  This file is deliberately unselected by
# every launcher.  See liveflow_shm/P3-TENSORFLOW-PREREGISTRATION.md.
defaults:
  rule_version: "p3-tf-rank-thread-v1"

rules:
  - id: cosmoflow.reader_posix_read.rank_thread_pool.reference45.v1
    priority: 100
    source_view: proc_name
    emit_mode: window
    scope_entity: reader_posix_read.rank_thread_pool
    rank_thread_only: true
    window_reducer: min
    window_reducer_metric: reader_posix_read_ops_slope
    fact_type: operation_family_time_disproportion
    scope_layer: reader_posix
    required_metrics:
      - domain_coherent
      - domain_procs_active
      - window_wall_time_proc_crit
      - domain_input_time_proc_crit
      - domain_decode_time_proc_crit
      - domain_comm_time_proc_crit
      - domain_compute_time_proc_crit
      - residual_time_proc_crit
      - epoch_nunique
      - step_nunique
      - step_min
      - step_max
      - reader_posix_read_count_frac_total
      - reader_posix_read_time_proc_frac_total
      - reader_posix_read_ops_slope
    derived_metrics:
      reader_posix_read_ops_slope_ref45_deficit: "clip01(1.0 - reader_posix_read_ops_slope)"
    when: "domain_coherent == 1.0 and epoch_nunique == 1.0 and step_nunique >= 1.0 and step_min <= step_max and reader_posix_read_count_frac_total > 0.0 and reader_posix_read_time_proc_frac_total > 0.0 and reader_posix_read_ops_slope > 0.0 and reader_posix_read_ops_slope_ref45_deficit > 0.0"
    severity_score: reader_posix_read_ops_slope_ref45_deficit
    opportunity_tags:
      - reader_parallelism
