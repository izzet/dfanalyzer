schema_version: analysisfact-rules.v1

defaults:
  rule_version: "1.0.0"
  emit_mode: per_row
  confidence: "0.80"

rules:
  - id: dlio.fetch_pressure.v1
    priority: 100
    source_view: epoch
    fact_type: fetch_pressure
    required_metrics:
      - fetch_data_time_proc_frac_parent
      - compute_time_proc_frac_parent
    when: "fetch_data_time_proc_frac_parent >= 0.20"
    severity_score: "clip01((fetch_data_time_proc_frac_parent - 0.10) / 0.25)"
    confidence: "clip01(0.75 + 0.20 * abs(fetch_data_time_proc_frac_parent - 0.20))"
    opportunity_tags:
      - dataloader_prefetch
      - reader_parallelism

  - id: dlio.reader_open_pressure.v1
    priority: 98
    source_view: epoch
    fact_type: reader_open_pressure
    required_metrics:
      - reader_open_time_proc_max
      - compute_time_proc_max
    derived_metrics:
      reader_open_ratio: "fillna0(reader_open_time_proc_max) / max(fillna0(compute_time_proc_max), 1e-9)"
    when: "reader_open_ratio > 1.05"
    severity_score: "clip01((reader_open_ratio - 1.0) / 0.50)"
    confidence: "clip01(0.70 + 0.20 * min(reader_open_ratio - 1.0, 1.0))"
    opportunity_tags:
      - reader_parallelism

  - id: dlio.step.reader_open_pressure.v1
    priority: 99
    source_view: step
    fact_type: reader_open_pressure
    required_metrics:
      - reader_open_time_proc_max
      - compute_time_proc_max
    derived_metrics:
      reader_open_ratio: "fillna0(reader_open_time_proc_max) / max(fillna0(compute_time_proc_max), 1e-9)"
    when: "reader_open_ratio > 1.05"
    severity_score: "clip01((reader_open_ratio - 1.0) / 0.50)"
    confidence: "clip01(0.70 + 0.20 * min(reader_open_ratio - 1.0, 1.0))"
    opportunity_tags:
      - reader_parallelism

  - id: dlio.reader_posix_pressure.v1
    priority: 97
    source_view: epoch
    fact_type: reader_posix_pressure
    required_metrics:
      - reader_posix_time_proc_max
      - compute_time_proc_max
    derived_metrics:
      reader_posix_ratio: "fillna0(reader_posix_time_proc_max) / max(fillna0(compute_time_proc_max), 1e-9)"
      reader_open_guard: "fillna0(reader_open_time_proc_max)"
    when: "reader_posix_ratio > 1.5 and reader_open_guard == 0"
    severity_score: "clip01((reader_posix_ratio - 1.0) / 2.0)"
    confidence: "clip01(0.70 + 0.20 * min(reader_posix_ratio - 1.0, 1.0))"
    opportunity_tags:
      - reader_parallelism

  - id: dlio.step.reader_posix_pressure.v1
    priority: 96
    source_view: step
    fact_type: reader_posix_pressure
    required_metrics:
      - reader_posix_time_proc_max
      - compute_time_proc_max
    derived_metrics:
      reader_posix_ratio: "fillna0(reader_posix_time_proc_max) / max(fillna0(compute_time_proc_max), 1e-9)"
      reader_open_guard: "fillna0(reader_open_time_proc_max)"
    when: "reader_posix_ratio > 1.5 and reader_open_guard == 0"
    severity_score: "clip01((reader_posix_ratio - 1.0) / 2.0)"
    confidence: "clip01(0.70 + 0.20 * min(reader_posix_ratio - 1.0, 1.0))"
    opportunity_tags:
      - reader_parallelism

  - id: dlio.step.fetch_pressure.v1
    priority: 101
    source_view: step
    fact_type: fetch_pressure
    required_metrics:
      - fetch_data_time_proc_max
      - compute_time_proc_max
    # The step/window view does not have _frac_parent columns natively because
    # parent layers (step, pipeline, app) span entire epochs and their time
    # aggregates are NULL within a single window. We derive the canonical
    # _frac_parent names here from the available leaf-layer times so that
    # downstream consumers (diagnoser key_metrics, optimizer evidence planner)
    # see the same metric names regardless of which view the fact came from.
    derived_metrics:
      step_active_time: "fillna0(fetch_data_time_proc_max) + fillna0(compute_time_proc_max)"
      fetch_data_time_proc_frac_parent: "fillna0(fetch_data_time_proc_max) / max(fillna0(fetch_data_time_proc_max) + fillna0(compute_time_proc_max), 1e-9)"
      compute_time_proc_frac_parent: "fillna0(compute_time_proc_max) / max(fillna0(fetch_data_time_proc_max) + fillna0(compute_time_proc_max), 1e-9)"
    when: "fetch_data_time_proc_frac_parent >= 0.20"
    severity_score: "clip01((fetch_data_time_proc_frac_parent - 0.10) / 0.25)"
    confidence: "clip01(0.75 + 0.20 * abs(fetch_data_time_proc_frac_parent - 0.20))"
    opportunity_tags:
      - dataloader_prefetch
      - reader_parallelism

  - id: dlio.compute_dominance.v1
    priority: 90
    source_view: epoch
    fact_type: compute_dominance
    required_metrics:
      - compute_time_proc_frac_parent
      - fetch_data_time_proc_frac_parent
    when: "compute_time_proc_frac_parent >= 0.90 and fetch_data_time_proc_frac_parent <= 0.10"
    severity_score: "clip01((compute_time_proc_frac_parent - 0.85) / 0.20)"
    confidence: "clip01(0.70 + 0.25 * compute_time_proc_frac_parent)"
    opportunity_tags:
      - none

  - id: dlio.reader_posix.small_read_dominance.v1
    priority: 89
    source_view: epoch
    fact_type: small_read_dominance
    scope_layer: reader_posix
    required_metrics:
      - reader_posix_read_time_proc_frac_parent
      - reader_posix_read_size_proc_mean
    when: "reader_posix_read_time_proc_frac_parent > 0.50 and reader_posix_read_size_proc_mean < 1048576"
    severity_score: "clip01(0.5 * ((reader_posix_read_time_proc_frac_parent - 0.50) / 0.50) + 0.5 * ((1048576 - reader_posix_read_size_proc_mean) / 1048576))"
    confidence: "clip01(0.75 + 0.10 * reader_posix_read_time_proc_frac_parent + 0.10 * ((1048576 - reader_posix_read_size_proc_mean) / 1048576))"
    opportunity_tags:
      - small_io_reduction

  - id: dlio.reader_posix.small_write_dominance.v1
    priority: 88
    source_view: epoch
    fact_type: small_write_dominance
    scope_layer: reader_posix
    required_metrics:
      - reader_posix_write_time_proc_frac_parent
      - reader_posix_write_size_proc_mean
    when: "reader_posix_write_time_proc_frac_parent > 0.50 and reader_posix_write_size_proc_mean < 1048576"
    severity_score: "clip01(0.5 * ((reader_posix_write_time_proc_frac_parent - 0.50) / 0.50) + 0.5 * ((1048576 - reader_posix_write_size_proc_mean) / 1048576))"
    confidence: "clip01(0.75 + 0.10 * reader_posix_write_time_proc_frac_parent + 0.10 * ((1048576 - reader_posix_write_size_proc_mean) / 1048576))"
    opportunity_tags:
      - small_io_reduction

  - id: dlio.reader_posix.excessive_metadata_access.v1
    priority: 87
    source_view: epoch
    fact_type: excessive_metadata_access
    scope_layer: reader_posix
    required_metrics:
      - reader_posix_metadata_time_proc_frac_parent
      - reader_posix_open_time_proc_frac_parent
      - reader_posix_close_time_proc_frac_parent
      - reader_posix_seek_time_proc_frac_parent
      - reader_posix_stat_time_proc_frac_parent
    when: "reader_posix_metadata_time_proc_frac_parent > 0.50"
    severity_score: "clip01((reader_posix_metadata_time_proc_frac_parent - 0.50) / 0.50)"
    confidence: "clip01(0.75 + 0.20 * reader_posix_metadata_time_proc_frac_parent)"
    opportunity_tags:
      - metadata_reduction

  - id: dlio.reader_posix.operation_imbalance.v1
    priority: 86
    source_view: epoch
    fact_type: operation_imbalance
    scope_layer: reader_posix
    required_metrics:
      - reader_posix_read_count_sum
      - reader_posix_write_count_sum
    derived_metrics:
      reader_posix_total_count_sum: "fillna0(reader_posix_read_count_sum) + fillna0(reader_posix_write_count_sum)"
      reader_posix_operation_imbalance_ratio: "abs(fillna0(reader_posix_read_count_sum) - fillna0(reader_posix_write_count_sum)) / max(min(fillna0(reader_posix_read_count_sum), fillna0(reader_posix_write_count_sum)), 1e-9)"
    when: "reader_posix_operation_imbalance_ratio > 0.10"
    severity_score: "clip01((reader_posix_operation_imbalance_ratio - 0.10) / 0.90)"
    confidence: "clip01(0.70 + 0.10 * reader_posix_operation_imbalance_ratio)"
    opportunity_tags:
      - read_write_rebalancing

  - id: dlio.reader_posix.size_imbalance.v1
    priority: 85
    source_view: epoch
    fact_type: size_imbalance
    scope_layer: reader_posix
    required_metrics:
      - reader_posix_read_size_sum
      - reader_posix_write_size_sum
    derived_metrics:
      reader_posix_total_size_sum: "fillna0(reader_posix_read_size_sum) + fillna0(reader_posix_write_size_sum)"
      reader_posix_size_imbalance_ratio: "abs(fillna0(reader_posix_read_size_sum) - fillna0(reader_posix_write_size_sum)) / max(min(fillna0(reader_posix_read_size_sum), fillna0(reader_posix_write_size_sum)), 1e-9)"
    when: "reader_posix_size_imbalance_ratio > 0.10"
    severity_score: "clip01((reader_posix_size_imbalance_ratio - 0.10) / 0.90)"
    confidence: "clip01(0.70 + 0.10 * reader_posix_size_imbalance_ratio)"
    opportunity_tags:
      - read_write_rebalancing

  - id: dlio.checkpoint_posix.small_read_dominance.v1
    priority: 84
    source_view: epoch
    fact_type: small_read_dominance
    scope_layer: checkpoint_posix
    required_metrics:
      - checkpoint_posix_read_time_proc_frac_parent
      - checkpoint_posix_read_size_proc_mean
    when: "checkpoint_posix_read_time_proc_frac_parent > 0.50 and checkpoint_posix_read_size_proc_mean < 1048576"
    severity_score: "clip01(0.5 * ((checkpoint_posix_read_time_proc_frac_parent - 0.50) / 0.50) + 0.5 * ((1048576 - checkpoint_posix_read_size_proc_mean) / 1048576))"
    confidence: "clip01(0.75 + 0.10 * checkpoint_posix_read_time_proc_frac_parent + 0.10 * ((1048576 - checkpoint_posix_read_size_proc_mean) / 1048576))"
    opportunity_tags:
      - small_io_reduction

  - id: dlio.checkpoint_posix.small_write_dominance.v1
    priority: 83
    source_view: epoch
    fact_type: small_write_dominance
    scope_layer: checkpoint_posix
    required_metrics:
      - checkpoint_posix_write_time_proc_frac_parent
      - checkpoint_posix_write_size_proc_mean
    when: "checkpoint_posix_write_time_proc_frac_parent > 0.50 and checkpoint_posix_write_size_proc_mean < 1048576"
    severity_score: "clip01(0.5 * ((checkpoint_posix_write_time_proc_frac_parent - 0.50) / 0.50) + 0.5 * ((1048576 - checkpoint_posix_write_size_proc_mean) / 1048576))"
    confidence: "clip01(0.75 + 0.10 * checkpoint_posix_write_time_proc_frac_parent + 0.10 * ((1048576 - checkpoint_posix_write_size_proc_mean) / 1048576))"
    opportunity_tags:
      - small_io_reduction

  - id: dlio.checkpoint_posix.excessive_metadata_access.v1
    priority: 82
    source_view: epoch
    fact_type: excessive_metadata_access
    scope_layer: checkpoint_posix
    required_metrics:
      - checkpoint_posix_metadata_time_proc_frac_parent
      - checkpoint_posix_open_time_proc_frac_parent
      - checkpoint_posix_close_time_proc_frac_parent
      - checkpoint_posix_seek_time_proc_frac_parent
      - checkpoint_posix_stat_time_proc_frac_parent
    when: "checkpoint_posix_metadata_time_proc_frac_parent > 0.50"
    severity_score: "clip01((checkpoint_posix_metadata_time_proc_frac_parent - 0.50) / 0.50)"
    confidence: "clip01(0.75 + 0.20 * checkpoint_posix_metadata_time_proc_frac_parent)"
    opportunity_tags:
      - metadata_reduction

  - id: dlio.checkpoint_posix.operation_imbalance.v1
    priority: 81
    source_view: epoch
    fact_type: operation_imbalance
    scope_layer: checkpoint_posix
    required_metrics:
      - checkpoint_posix_read_count_sum
      - checkpoint_posix_write_count_sum
    derived_metrics:
      checkpoint_posix_total_count_sum: "fillna0(checkpoint_posix_read_count_sum) + fillna0(checkpoint_posix_write_count_sum)"
      checkpoint_posix_operation_imbalance_ratio: "abs(fillna0(checkpoint_posix_read_count_sum) - fillna0(checkpoint_posix_write_count_sum)) / max(min(fillna0(checkpoint_posix_read_count_sum), fillna0(checkpoint_posix_write_count_sum)), 1e-9)"
      checkpoint_posix_mixed_count_activity: "min(fillna0(checkpoint_posix_read_count_sum), fillna0(checkpoint_posix_write_count_sum))"
    when: "checkpoint_posix_mixed_count_activity > 0 and checkpoint_posix_operation_imbalance_ratio > 0.10"
    severity_score: "clip01((checkpoint_posix_operation_imbalance_ratio - 0.10) / 0.90)"
    confidence: "clip01(0.70 + 0.10 * checkpoint_posix_operation_imbalance_ratio)"
    opportunity_tags:
      - read_write_rebalancing

  - id: dlio.checkpoint_posix.size_imbalance.v1
    priority: 80
    source_view: epoch
    fact_type: size_imbalance
    scope_layer: checkpoint_posix
    required_metrics:
      - checkpoint_posix_read_size_sum
      - checkpoint_posix_write_size_sum
    derived_metrics:
      checkpoint_posix_total_size_sum: "fillna0(checkpoint_posix_read_size_sum) + fillna0(checkpoint_posix_write_size_sum)"
      checkpoint_posix_size_imbalance_ratio: "abs(fillna0(checkpoint_posix_read_size_sum) - fillna0(checkpoint_posix_write_size_sum)) / max(min(fillna0(checkpoint_posix_read_size_sum), fillna0(checkpoint_posix_write_size_sum)), 1e-9)"
      checkpoint_posix_mixed_size_activity: "min(fillna0(checkpoint_posix_read_size_sum), fillna0(checkpoint_posix_write_size_sum))"
    when: "checkpoint_posix_mixed_size_activity > 0 and checkpoint_posix_size_imbalance_ratio > 0.10"
    severity_score: "clip01((checkpoint_posix_size_imbalance_ratio - 0.10) / 0.90)"
    confidence: "clip01(0.70 + 0.10 * checkpoint_posix_size_imbalance_ratio)"
    opportunity_tags:
      - read_write_rebalancing

  - id: dlio.epoch_straggler.v1
    priority: 110
    source_view: proc_name
    emit_mode: window
    fact_type: epoch_straggler
    required_metrics:
      - epoch_time_proc_max
    derived_metrics:
      epoch_straggler_ratio: "max(epoch_time_proc_max) / max(min(epoch_time_proc_max), 1e-9)"
    when: "epoch_straggler_ratio > 1.05"
    severity_score: "clip01((epoch_straggler_ratio - 1.0) / 0.20)"
    confidence: "clip01(0.75 + 0.25 * (epoch_straggler_ratio - 1.0))"
    opportunity_tags:
      - rank_balance
      - pipeline_sync

  - id: dlio.fetch_rank_imbalance.v1
    priority: 120
    source_view: proc_name
    emit_mode: window
    fact_type: fetch_rank_imbalance
    required_metrics:
      - fetch_data_time_proc_max
      - fetch_data_time_proc_frac_parent
    derived_metrics:
      fetch_rank_ratio: "max(fetch_data_time_proc_max) / max(min(fetch_data_time_proc_max), 1e-9)"
      fetch_share_max: "max(fetch_data_time_proc_frac_parent)"
    when: "fetch_rank_ratio >= 1.5"
    severity_score: "clip01((fetch_rank_ratio - 1.0) / 2.5)"
    confidence: "clip01(0.70 + 0.20 * fetch_share_max + 0.10 * (fetch_rank_ratio - 1.0))"
    opportunity_tags:
      - rank_balance
      - shard_repartition

  - id: dlio.checkpoint_tail_skew.v1
    priority: 130
    source_view: proc_name
    emit_mode: window
    fact_type: checkpoint_tail_skew
    required_metrics:
      - checkpoint_time_proc_max
      - checkpoint_time_proc_frac_parent
    derived_metrics:
      checkpoint_rank_ratio: "max(checkpoint_time_proc_max) / max(min(checkpoint_time_proc_max), 1e-9)"
      checkpoint_share_max: "max(checkpoint_time_proc_frac_parent)"
    when: "checkpoint_rank_ratio >= 10 and checkpoint_share_max >= 0.001"
    severity_score: "clip01(0.5 * ((checkpoint_rank_ratio - 1.0) / 20.0) + 0.5 * (checkpoint_share_max / 0.02))"
    confidence: "clip01(0.75 + 0.10 * checkpoint_share_max + 0.10 * (checkpoint_rank_ratio - 1.0) / 20.0)"
    opportunity_tags:
      - checkpoint_aggregation
      - io_batching

  - id: dlio.time_range.fetch_interval_pressure.v1
    priority: 95
    source_view: time_range
    fact_type: fetch_interval_pressure
    required_metrics:
      - fetch_data_time_proc_frac_parent
      - compute_time_proc_frac_parent
      - epoch_time_proc_max
    derived_metrics:
      fetch_minus_compute: "fetch_data_time_proc_frac_parent - compute_time_proc_frac_parent"
    when: "fetch_data_time_proc_frac_parent >= 0.60 and epoch_time_proc_max >= 1.0"
    severity_score: "clip01((fetch_data_time_proc_frac_parent - 0.40) / 0.40)"
    confidence: "clip01(0.70 + 0.20 * abs(fetch_minus_compute))"
    opportunity_tags:
      - dataloader_prefetch
      - reader_parallelism

  - id: dlio.time_range.compute_interval_dominance.v1
    priority: 94
    source_view: time_range
    fact_type: compute_interval_dominance
    required_metrics:
      - compute_time_proc_frac_parent
      - fetch_data_time_proc_frac_parent
      - epoch_time_proc_max
    when: "compute_time_proc_frac_parent >= 0.45 and fetch_data_time_proc_frac_parent <= 0.50 and epoch_time_proc_max >= 1.0"
    severity_score: "clip01((compute_time_proc_frac_parent - 0.35) / 0.40)"
    confidence: "clip01(0.70 + 0.20 * compute_time_proc_frac_parent)"
    opportunity_tags:
      - kernel_overlap
      - pipeline_tuning

  - id: dlio.time_range.checkpoint_interval_burst.v1
    priority: 96
    source_view: time_range
    fact_type: checkpoint_interval_burst
    required_metrics:
      - checkpoint_time_proc_max
      - checkpoint_time_proc_frac_parent
      - fetch_data_time_proc_max
    derived_metrics:
      checkpoint_to_fetch_ratio: "checkpoint_time_proc_max / (fetch_data_time_proc_max + 1e-9)"
    when: "checkpoint_time_proc_max >= 0.02 and checkpoint_to_fetch_ratio >= 0.10"
    severity_score: "clip01(0.5 * (checkpoint_to_fetch_ratio / 0.30) + 0.5 * (checkpoint_time_proc_max / 0.20))"
    confidence: "clip01(0.70 + 0.20 * checkpoint_time_proc_frac_parent + 0.10 * checkpoint_to_fetch_ratio)"
    opportunity_tags:
      - checkpoint_aggregation
      - io_batching
