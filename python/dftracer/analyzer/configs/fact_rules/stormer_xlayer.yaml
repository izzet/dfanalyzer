
# CROSS-LAYER ATTRIBUTION for StorMer: charge DISPLACED input cost to INPUT, not to comm.
# LIVEFLOW-STATUS.md sec 35. This is the paper's observation contribution made OPERATIONAL --
# until now it existed only as an OFFLINE measurement (the barrier probe), never in the live loop.
#
# THE PROBLEM THIS FIXES (measured, sec 22.10 / 34.2-CH1, StorMer 4N):
#   attribution        workers=1                  workers=8                verdict
#   NAIVE (measured)   input 25.9% comm 51.9%     input 1.8% comm 52.4%    comm dominant BOTH times
#                                                                          -> NO SHIFT VISIBLE
#   CORRECT (skew->input) input 50.0% comm 27.8%  input 15.0% comm 39.5%   INPUT -> COMM shift
#
# A naive controller therefore sees "comm dominates" from the very first window and tunes the comm
# knob, which sec 29 shows gives no benefit (and possibly harm) while input is still starved. The
# cost is really input pain DISPLACED into the collective as straggler wait: at workers=1 the skew
# (116 ms) almost exactly equals the exposed fetch it came from (125 ms).
#
# THE ONLINE SIGNAL. We cannot run the barrier probe in production (it costs ~7% and perturbs the
# pipeline), so displaced input is detected from CROSS-RANK FETCH SPREAD, which needs no extra
# synchronisation: if ranks disagree about how long fetch took, the slowest rank makes everyone wait
# inside the collective, and that wait is input-caused. fetch_rank_ratio = max/min over ranks is
# already computed by stormer.yaml's fetch_rank_imbalance rule -- it was simply never connected to a
# knob or to comm.
#
# THE ACTION. Two things, and the second matters more than the first:
#   1. emit `reader_parallelism` (-> num_workers) so the INPUT knob is what moves; and
#   2. SUPPRESS `comm_optimization` while displacement is active, so the controller does not spend
#      its comm knob on a bottleneck that is not really comm. Once input is fixed the spread
#      collapses, this rule stops firing, suppression lifts, and comm becomes actionable --
#      which IS the cross-domain shift, executed by the controller.
#
# THRESHOLD-FREE: severity is CONTINUOUS in the displacement evidence (how lopsided the ranks are)
# rather than a hand-set cutoff, and `when` is the trivially-true activity guard used by halo3d.yaml.
# The one constant here (the 1.0 normaliser in displaced_frac) is a UNIT, not a tuned gate: ratio 1.0
# means perfectly balanced ranks = zero displacement, which is a physical definition, not a knob.

# BUILT AS: stormer.yaml (all baseline rules, byte-identical) + the displaced_input rule above.
# The ablation is therefore EXACTLY ONE RULE: naive = stormer.yaml, cross-layer = this file.

# NOTE: this file makes TWO changes vs stormer.yaml, not one:
#   1. ADDS stormer_xlayer.displaced_input.v1 (priority 250)
#   2. REMOVES comm_dominance's suppresses_tags [reader_parallelism, dataloader_prefetch]
# (2) is REQUIRED: without it the two rules mutually suppress and NOTHING can act.

schema_version: analysisfact-rules.v1
defaults:
  rule_version: 1.0.0
  emit_mode: per_row
  confidence: '0.80'
rules:
- id: stormer_xlayer.decode_pressure.v1
  priority: 240
  source_view: epoch
  emit_mode: window
  fact_type: decode_pressure
  required_metrics:
  - fetch_iter_time_proc_max
  - reader_decode_time_proc_max
  - comm_time_proc_max
  - compute_time_proc_max
  derived_metrics:
    active_time: fillna0(fetch_iter_time_proc_max) + fillna0(comm_time_proc_max) +
      fillna0(compute_time_proc_max)
    # DECODE IS NESTED INSIDE FETCH_ITER, so the denominator is the fetch it lives in.
    #
    # Was decode / active_time, where active_time = fetch + comm + compute. Since decode is a
    # COMPONENT of fetch, that denominator double-counts the interval decode sits inside and adds
    # two more that decode is not part of at all -- it is not a fraction of anything, and measured
    # on StorMer it came out >= 1, pinning clip01 at exactly 1.000 (phase 30).
    #
    # decode / fetch_iter answers the question the knob actually poses: of the time the step spends
    # waiting on fetch, how much is the inflate stage that `decode_threads` parallelises? A value
    # near 1 means decode owns the fetch path and decode_parallelism is the right lever; near 0
    # means the fetch cost is elsewhere and raising decode_threads would buy nothing.
    #
    # `severity_frac` then rescales that by fetch's own share of the step, so a workload whose
    # fetch is irrelevant cannot report a severe decode problem: decode owning 100% of a fetch that
    # is 5% of the step is a 0.05 severity, not a 1.0.
    decode_frac: fillna0(reader_decode_time_proc_max) / max(fillna0(fetch_iter_time_proc_max), 1e-9)
    fetch_share: fillna0(fetch_iter_time_proc_max) / max(active_time, 1e-9)
    severity_frac: min(decode_frac, 1.0) * fetch_share
  when: active_time > 0
  # Severity is decode's contribution TO THE STEP: its share of fetch, times fetch's share of the
  # step. Bounded by construction, monotone, and physical -- 1.0 means the step is entirely decode.
  #
  # The earlier attempt here rescaled clip01(decode_frac / 0.25) to clip01(decode_frac) on the
  # phase 23 argument that a divisor only discards gradient. That was wrong because the DENOMINATOR
  # was wrong, not the scale, and the measurement said so: severity stayed at exactly 1.000 and the
  # effectiveness gate -- improvement = (severity_at_action - current)/severity_at_action -- stayed
  # identically 0, so decode_threads got one increment (1 -> 2) and was blocked forever after.
  # Phase 34 priced that: the loop reached num_workers=8 (the optimum) and decode_threads=2 (should
  # be 8), landing 91.6% off the best static config.
  #
  # `min(decode_frac, 1.0)` is a guard, not a rescale: decode and fetch_iter are aggregated per
  # process, so a multi-threaded decode pool can sum to more thread-time than the wall interval it
  # is nested in. Capping the SHARE at 1 keeps the product meaningful; it does not flatten the
  # range the way the old formula did.
  severity_score: clip01(severity_frac)
  confidence: '1.0'
  opportunity_tags:
  - decode_parallelism
- id: stormer_xlayer.displaced_input.v1
  priority: 250
  source_view: epoch
  emit_mode: window
  fact_type: displaced_input_pressure
  required_metrics:
  - fetch_iter_time_proc_max
  - comm_time_proc_max
  - compute_time_proc_max
  derived_metrics:
    active_time: fillna0(fetch_iter_time_proc_max) + fillna0(comm_time_proc_max) +
      fillna0(compute_time_proc_max)
    comm_frac: fillna0(comm_time_proc_max) / max(active_time, 1e-9)
    fetch_rank_ratio: max(fillna0(fetch_iter_time_proc_max)) / max(min(fillna0(fetch_iter_time_proc_max)),
      1e-9)
    displaced_frac: clip01((fetch_rank_ratio - 1.0) / max(fetch_rank_ratio, 1e-9))
      * comm_frac
  when: active_time > 0
  severity_score: clip01(displaced_frac / 0.25)
  confidence: '1.0'
  opportunity_tags:
  - reader_parallelism
  - dataloader_prefetch
  suppresses_tags:
  - comm_optimization
- id: stormer.fetch_pressure.v1
  priority: 100
  source_view: epoch
  fact_type: fetch_pressure
  required_metrics:
  - fetch_iter_time_proc_max
  - compute_time_proc_max
  derived_metrics:
    active_time: fillna0(fetch_iter_time_proc_max) + fillna0(compute_time_proc_max)
    fetch_frac: fillna0(fetch_iter_time_proc_max) / max(fillna0(fetch_iter_time_proc_max)
      + fillna0(compute_time_proc_max), 1e-9)
    compute_frac: fillna0(compute_time_proc_max) / max(fillna0(fetch_iter_time_proc_max)
      + fillna0(compute_time_proc_max), 1e-9)
  when: fetch_frac >= 0.20 and compute_frac < 0.85
  # De-saturated for the same reason; fetch_frac is already the stall fraction because
  # fetch_iter_time comes from dft_ai.dataloader.fetch.iter, which times the blocking __next__.
  severity_score: clip01(fetch_frac)
  confidence: clip01(0.75 + 0.20 * abs(fetch_frac - 0.20))
  opportunity_tags:
  - dataloader_prefetch
  - reader_parallelism
- id: stormer.open_pressure.v1
  priority: 98
  source_view: epoch
  fact_type: open_pressure
  required_metrics:
  - reader_open_time_proc_max
  - compute_time_proc_max
  - fetch_iter_time_proc_max
  derived_metrics:
    active_time: fillna0(fetch_iter_time_proc_max) + fillna0(compute_time_proc_max)
    compute_frac: fillna0(compute_time_proc_max) / max(active_time, 1e-9)
    reader_open_ratio: fillna0(reader_open_time_proc_max) / max(fillna0(compute_time_proc_max),
      1e-9)
  when: reader_open_ratio > 1.05 and compute_frac < 0.85
  severity_score: clip01((reader_open_ratio - 1.0) / 0.50)
  confidence: clip01(0.70 + 0.20 * min(reader_open_ratio - 1.0, 1.0))
  opportunity_tags:
  - reader_parallelism
- id: stormer.read_pressure.v1
  priority: 97
  source_view: epoch
  fact_type: read_pressure
  required_metrics:
  - reader_posix_time_proc_max
  - compute_time_proc_max
  - fetch_iter_time_proc_max
  derived_metrics:
    active_time: fillna0(fetch_iter_time_proc_max) + fillna0(compute_time_proc_max)
    compute_frac: fillna0(compute_time_proc_max) / max(active_time, 1e-9)
    reader_posix_ratio: fillna0(reader_posix_time_proc_max) / max(fillna0(compute_time_proc_max),
      1e-9)
    reader_open_guard: fillna0(reader_open_time_proc_max)
  when: reader_posix_ratio > 1.5 and reader_open_guard == 0 and compute_frac < 0.85
  severity_score: clip01((reader_posix_ratio - 1.0) / 2.0)
  confidence: clip01(0.70 + 0.20 * min(reader_posix_ratio - 1.0, 1.0))
  opportunity_tags:
  - reader_parallelism
- id: stormer.compute_dominance.v1
  priority: 200
  source_view: epoch
  fact_type: compute_dominance
  required_metrics:
  - compute_time_proc_max
  - fetch_iter_time_proc_max
  derived_metrics:
    active_time: fillna0(fetch_iter_time_proc_max) + fillna0(compute_time_proc_max)
    compute_frac: fillna0(compute_time_proc_max) / max(active_time, 1e-9)
    fetch_frac: fillna0(fetch_iter_time_proc_max) / max(fillna0(fetch_iter_time_proc_max)
      + fillna0(compute_time_proc_max), 1e-9)
  when: compute_frac >= 0.90 and fetch_frac <= 0.10
  severity_score: clip01((compute_frac - 0.85) / 0.20)
  confidence: clip01(0.70 + 0.25 * compute_frac)
  opportunity_tags:
  - none
  suppresses_tags:
  - reader_parallelism
  - dataloader_prefetch
- id: stormer.comm_dominance.v1
  priority: 150
  source_view: epoch
  fact_type: comm_dominance
  required_metrics:
  - comm_time_proc_max
  - compute_time_proc_max
  - fetch_iter_time_proc_max
  derived_metrics:
    active_time: fillna0(fetch_iter_time_proc_max) + fillna0(compute_time_proc_max)
    comm_frac: fillna0(comm_time_proc_max) / max(active_time, 1e-9)
    compute_frac: fillna0(compute_time_proc_max) / max(active_time, 1e-9)
    pure_compute_frac: max(fillna0(compute_time_proc_max) - fillna0(comm_time_proc_max),
      0.0) / max(active_time, 1e-9)
  when: comm_frac >= 0.30
  severity_score: clip01((comm_frac - 0.25) / 0.50)
  confidence: clip01(0.70 + 0.25 * comm_frac)
  opportunity_tags:
  - comm_optimization
- id: stormer.reader_posix.small_read_dominance.v1
  priority: 89
  source_view: epoch
  fact_type: small_read_dominance
  scope_layer: reader_posix
  required_metrics:
  - reader_posix_read_time_proc_frac_parent
  - reader_posix_read_size_proc_mean
  when: reader_posix_read_time_proc_frac_parent > 0.50 and reader_posix_read_size_proc_mean
    < 1048576
  severity_score: clip01(0.5 * ((reader_posix_read_time_proc_frac_parent - 0.50) /
    0.50) + 0.5 * ((1048576 - reader_posix_read_size_proc_mean) / 1048576))
  confidence: clip01(0.75 + 0.10 * reader_posix_read_time_proc_frac_parent + 0.10
    * ((1048576 - reader_posix_read_size_proc_mean) / 1048576))
  opportunity_tags:
  - small_io_reduction
- id: stormer.reader_posix.small_write_dominance.v1
  priority: 88
  source_view: epoch
  fact_type: small_write_dominance
  scope_layer: reader_posix
  required_metrics:
  - reader_posix_write_time_proc_frac_parent
  - reader_posix_write_size_proc_mean
  when: reader_posix_write_time_proc_frac_parent > 0.50 and reader_posix_write_size_proc_mean
    < 1048576
  severity_score: clip01(0.5 * ((reader_posix_write_time_proc_frac_parent - 0.50)
    / 0.50) + 0.5 * ((1048576 - reader_posix_write_size_proc_mean) / 1048576))
  confidence: clip01(0.75 + 0.10 * reader_posix_write_time_proc_frac_parent + 0.10
    * ((1048576 - reader_posix_write_size_proc_mean) / 1048576))
  opportunity_tags:
  - small_io_reduction
- id: stormer.reader_posix.metadata_dominance.v1
  priority: 87
  source_view: epoch
  fact_type: metadata_dominance
  scope_layer: reader_posix
  required_metrics:
  - reader_posix_metadata_time_proc_frac_parent
  when: reader_posix_metadata_time_proc_frac_parent > 0.50
  severity_score: clip01((reader_posix_metadata_time_proc_frac_parent - 0.50) / 0.50)
  confidence: clip01(0.75 + 0.20 * reader_posix_metadata_time_proc_frac_parent)
  opportunity_tags:
  - metadata_reduction
- id: stormer.reader_posix.operation_imbalance.v1
  priority: 86
  source_view: epoch
  fact_type: operation_imbalance
  scope_layer: reader_posix
  required_metrics:
  - reader_posix_read_count_sum
  - reader_posix_write_count_sum
  derived_metrics:
    reader_posix_operation_imbalance_ratio: abs(fillna0(reader_posix_read_count_sum)
      - fillna0(reader_posix_write_count_sum)) / max(min(fillna0(reader_posix_read_count_sum),
      fillna0(reader_posix_write_count_sum)), 1e-9)
  when: reader_posix_operation_imbalance_ratio > 0.10
  severity_score: clip01((reader_posix_operation_imbalance_ratio - 0.10) / 0.90)
  confidence: clip01(0.70 + 0.10 * reader_posix_operation_imbalance_ratio)
  opportunity_tags:
  - read_write_rebalancing
- id: stormer.reader_posix.size_imbalance.v1
  priority: 85
  source_view: epoch
  fact_type: size_imbalance
  scope_layer: reader_posix
  required_metrics:
  - reader_posix_read_size_sum
  - reader_posix_write_size_sum
  derived_metrics:
    reader_posix_size_imbalance_ratio: abs(fillna0(reader_posix_read_size_sum) - fillna0(reader_posix_write_size_sum))
      / max(min(fillna0(reader_posix_read_size_sum), fillna0(reader_posix_write_size_sum)),
      1e-9)
  when: reader_posix_size_imbalance_ratio > 0.10
  severity_score: clip01((reader_posix_size_imbalance_ratio - 0.10) / 0.90)
  confidence: clip01(0.70 + 0.10 * reader_posix_size_imbalance_ratio)
  opportunity_tags:
  - read_write_rebalancing
- id: stormer.fetch_rank_imbalance.v1
  priority: 120
  source_view: proc_name
  emit_mode: window
  fact_type: fetch_rank_imbalance
  required_metrics:
  - fetch_iter_time_proc_max
  derived_metrics:
    fetch_rank_ratio: max(fetch_iter_time_proc_max) / max(min(fetch_iter_time_proc_max),
      1e-9)
  when: fetch_rank_ratio >= 1.5
  severity_score: clip01((fetch_rank_ratio - 1.0) / 2.5)
  confidence: clip01(0.70 + 0.20 * (fetch_rank_ratio - 1.0))
  opportunity_tags:
  - rank_balance
  - shard_repartition
