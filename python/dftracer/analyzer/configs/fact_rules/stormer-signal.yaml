schema_version: analysisfact-rules.v1

# StorMer storage<->decode<->comm<->compute — THRESHOLD-FREE. Replaces stormer.yaml.
#
# stormer.yaml is where the magic numbers that reviewers R1/R3/R4 objected to actually live:
# fetch_frac >= 0.20, comm_frac >= 0.30, compute_frac < 0.85, and eight more across its 11 rules.
# halo3d_gated.yaml documents what they cost, and deliberately carries THESE values to make the
# point that they were transplanted across workloads without retuning:
#   "delayed onset (a gate must be crossed before anything is emitted), mis-targeting (a domain
#    below its threshold is invisible even when it is the largest term), and severity-driven
#    evidence selection."
#
# This file emits ONE per-window finding with the raw per-domain times and lets the planner decide.
# Identical in shape to halo3d.yaml and dlio-signal.yaml; only the metric set differs, because the
# StorMer preset is the one that has all four domains.
#
# REQUIRES a planner that can decide from raw metrics and can choose to do nothing:
# DFOPTIMIZER_ALGO=clbo or cbandit. The default rule Planner acts on every finding it receives, so
# pairing it with an unconditional finding means actuating every window.

defaults:
  rule_version: "1.0.0"
  emit_mode: window
  confidence: "1.0"

rules:
  - id: stormer.fourway_signal.v1
    priority: 100
    source_view: epoch
    emit_mode: window
    fact_type: fourway_signal
    required_metrics:
      # THIS LIST IS THE WIRE (dlio-signal.yaml says why at length). Evidence metrics are built
      # from required_metrics plus derived_metrics and nothing else, so a metric the analyzer
      # computes perfectly and this list omits reaches the planner as ABSENT.
      #
      # stall_storage was exactly that on `stcz2_loop_r1` (T3-0 4s.41, 4s.42): the workload emits
      # `stall.storage` at every window boundary, the preset defines the layer, the diagnoser's own
      # flat views carry the column with real values -- 1.9 to 5.3 s in the windows holding the
      # periodic stall against 0.013 s in the others -- and the planner logged
      # `domain_exposure_fallback` on all 14 windows and priced the input domain from `fetch_iter`
      # at a median 0.041 s instead. Four of fourteen windows reached a candidate, and none moved.
      - fetch_iter_time_proc_max
      - stall_storage_time_proc_max
      - stall_decode_time_proc_max
      - reader_posix_time_proc_max
      - reader_decode_time_proc_max
      - comm_time_proc_max
      - compute_time_proc_max
      - window_wall_time_proc_max
    derived_metrics:
      # THE WALL IS THE WALL, not the sum of the domains (T3-0 4s.41).
      #
      # `fetch + comm + compute` looks like a decomposition and is not one on this preset:
      # `compute_time_proc_max` INCLUDES comm, which is why `domains_from_metrics` returns
      # `compute - comm`, so that sum counts comm twice. The planner's residual is
      # `wall - sum(domains)` = `(fetch + comm + compute) - (fetch + compute)` = comm EXACTLY, and
      # the record shows it to four decimals in all 14 windows of `stcz2_loop_r1`. comm then won
      # the argmax as `unattributed`, which owns no knob, and ten of the fourteen windows declined
      # for a reason that was arithmetic rather than measured.
      #
      # dlio-signal.yaml has used the real wall since the same defect was found there; this is the
      # same fix, and it makes the residual an honest measure of what is not attributed.
      active_time: "fillna0(window_wall_time_proc_max)"
    when: "active_time > 0"      # trivially true (a window ran) -> NOT a domain gate.
    severity_score: "1.0"
    confidence: "1.0"
    # Inert under clbo/cbandit: the planner infers the domain from the knob->domain map and decides
    # from the measured times. Present so the knob registry can bind knobs to this finding.
    opportunity_tags:
      - reader_parallelism
      - dataloader_prefetch
      - decode_parallelism
      - comm_pressure
